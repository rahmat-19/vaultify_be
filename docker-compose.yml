services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - vaultify_data:/app/data
    environment:
      DATABASE_URL: sqlite:////app/data/vaultify.db
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  vaultify_data:
